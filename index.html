<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanks!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f1a; --glass:rgba(12,17,30,.72); --glass-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --text:#eef2ff; --muted:#94a0b8; --accent:#ff7a1a; --accent-2:#ff3d6e; --ok:#34d399; --warn:#fbbf24;
    --ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Russo One","Outfit",system-ui,sans-serif;
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  canvas{position:fixed;left:0;top:0;display:block;cursor:none}
  #ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  #uiInner{position:absolute;left:0;top:0;width:880px;height:732px;transform-origin:0 0;font-family:var(--ui);color:var(--text);-webkit-font-smoothing:antialiased}
  .screen{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;padding-top:170px;box-sizing:border-box}
  .screen.on{display:flex;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .panel{pointer-events:auto;cursor:default;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--line);border-radius:22px;padding:22px 26px;width:360px;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
    display:flex;flex-direction:column;gap:10px;text-align:center}
  .panel.wide{width:450px}
  .panel h2{margin:0 0 2px;font:600 22px var(--ui);letter-spacing:.2px}
  button{display:flex;align-items:center;justify-content:center;gap:10px;font:600 16px var(--ui);color:#fff;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 22px rgba(255,90,60,.28),inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s,box-shadow .2s,filter .2s,background .2s}
  button svg{width:18px;height:18px;flex:none}
  button:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 12px 28px rgba(255,90,60,.36),inset 0 1px 0 rgba(255,255,255,.25)}
  button:active{transform:translateY(1px) scale(.99)}
  button:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed;transform:none}
  button.sec{background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--text);font-weight:500}
  button.sec:hover{background:rgba(255,255,255,.1)}
  button.small{padding:7px 12px;font-size:13px;border-radius:10px}
  input{font:600 18px var(--ui);padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
  input::placeholder{color:rgba(255,255,255,.3)}
  input:focus{border-color:rgba(255,122,26,.8);box-shadow:0 0 0 4px rgba(255,122,26,.18)}
  #code{letter-spacing:10px;text-transform:uppercase;font:26px var(--display)}
  .status{min-height:18px;margin:0;color:var(--warn);font-size:14px}
  .status:empty{display:none}
  .divider{height:1px;background:var(--line);margin:4px 0}
  #scrLobby{padding-top:180px}
  #scrLobby .panel{gap:10px;padding:18px 24px}
  .code-box{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:14px;padding:8px 10px}
  .code-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:2px}
  .code-row b{font:30px var(--display);letter-spacing:8px;background:linear-gradient(135deg,#ffd166,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  ul.players{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  ul.players li{position:relative;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;font-size:14px;font-weight:500;text-align:left;min-width:0;overflow:hidden}
  ul.players li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,#555)}
  ul.players li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.players li.empty{color:rgba(255,255,255,.3);font-weight:400;border-style:dashed;background:transparent}
  ul.players li.empty::before{opacity:.25}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
  .tag{margin-left:auto;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .modes{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px}
  .modes button{flex:1;background:transparent;box-shadow:none;color:var(--muted);font-weight:600;padding:9px 10px;border-radius:10px}
  .modes button:hover{transform:none;box-shadow:none;color:var(--text)}
  .modes button.sel{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 16px rgba(255,90,60,.3)}
  .modes button:disabled{filter:none;cursor:default}
  .hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.55}
  .keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:12px;color:var(--muted)}
  kbd{font:600 11px var(--ui);color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;margin-right:3px}
  .label{font-size:11px;font-weight:600;color:var(--muted);text-align:left;margin-bottom:-4px;text-transform:uppercase;letter-spacing:1.2px}
</style>
</head>
<body>
<canvas id="game"></canvas>
  <div id="ui"><div id="uiInner">
    <div class="screen" id="scrMain">
      <div class="panel">
        <div class="label">Ton pseudo</div>
        <input id="name" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Joueur">
        <button id="btnSolo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>Solo — Campagne</button>
        <button id="btnHost" class="sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Créer une partie en ligne</button>
        <button id="btnJoin" class="sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Rejoindre une partie</button>
        <button id="btnFull" class="sec small"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>Plein écran</button>
        <p class="status" id="mainStatus"></p>
        <div class="divider"></div>
        <div class="keys"><span><kbd>ZQSD</kbd>bouger</span><span><kbd>Souris</kbd>viser</span><span><kbd>Clic</kbd>tirer</span><span><kbd>Clic droit</kbd>mine</span><span><kbd>M</kbd>son</span><span><kbd>P</kbd>pause</span><span><kbd>F</kbd>plein écran</span></div>
      </div>
    </div>
    <div class="screen" id="scrJoin">
      <div class="panel">
        <h2>Rejoindre une partie</h2>
        <div class="label">Code du salon</div>
        <input id="code" maxlength="5" autocomplete="off" spellcheck="false" placeholder="ABCDE">
        <button id="btnJoinGo">Rejoindre</button>
        <button class="sec" id="btnJoinBack">Retour</button>
        <p class="status" id="joinStatus"></p>

    </div>
    <div class="screen" id="scrLobby">

        <h2>Salon</h2>
        <div class="code-box">Code à partager<div class="code-row"><b id="lobbyCode">·····</b><button class="small sec" id="btnCopy">Copier</button></div></div>
        <ul class="players" id="lobbyPlayers"></ul>
        <div class="modes"><button id="modeCoop">Coopération</button><button id="modeVs">Versus</button></div>
        <p class="hint" id="modeDesc"></p>
        <button id="btnStart">Lancer la partie</button>
        <button class="sec" id="btnLeave">Quitter le salon</button>
        <p class="status" id="lobbyStatus"></p>
      </div>
    </div>
  </div></div>
<script>
'use strict';
// ============================================================
//  TANKS!  —  recréation du mini-jeu de Wii Play, avec multijoueur en ligne
// ============================================================
// Les missions sont dessinées sur une grille de base 22 x 17, centrée dans une arène
// qui s'élargit (ou s'allonge) pour remplir la fenêtre avec du terrain jouable.
const T = 40, HUD = 52, BASE_C = 22, BASE_R = 17, MAX_C = 44, MAX_R = 30;
const FRAME_W = 880, FRAME_H = 732; // cadre de conception des menus
let COLS = BASE_C, ROWS = BASE_R, AW = COLS * T, AH = ROWS * T, CW = AW, CH = AH + HUD;
let OX = 0, OY = 0;                  // décalage (en cases) de la carte de base dans l'arène
const TAU = Math.PI * 2;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const uiInner = document.getElementById('uiInner');
const view = { s: 1, x: 0, y: 0, dpr: 1 };   // cadrage de l'arène dans le canvas
const frame = { s: 1, x: 0, y: 0 };          // cadrage des menus (en pixels CSS)

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// taille d'arène (en cases) qui épouse au mieux la forme de la fenêtre
function arenaDimsFor(w, h) {
  if (!(w > 0 && h > 0)) return { cols: COLS, rows: ROWS }; // fenêtre pas encore visible
  let rows = BASE_R, cols = Math.round((rows * T + HUD) * (w / h) / T);
  if (cols < BASE_C) { cols = BASE_C; rows = Math.round((cols * T * h / w - HUD) / T); }
  cols = clamp(cols, BASE_C, MAX_C); rows = clamp(rows, BASE_R, MAX_R);
  cols -= (cols - BASE_C) % 2; rows -= (rows - BASE_R) % 2; // marges identiques des deux côtés
  return { cols, rows };
}
function layout() {
  view.s = Math.max(1e-3, Math.min(cv.width / CW, cv.height / CH));
  view.x = (cv.width - CW * view.s) / 2;
  view.y = (cv.height - CH * view.s) / 2;
}
function resize() {
  view.dpr = window.devicePixelRatio || 1;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  cv.width = Math.floor(innerWidth * view.dpr); cv.height = Math.floor(innerHeight * view.dpr);
  frame.s = Math.max(1e-3, Math.min(innerWidth / FRAME_W, innerHeight / FRAME_H));
  frame.x = (innerWidth - FRAME_W * frame.s) / 2; frame.y = (innerHeight - FRAME_H * frame.s) / 2;
  uiInner.style.transform = `translate(${frame.x}px,${frame.y}px) scale(${frame.s})`;
  layout();
  clearTimeout(resize.timer);
  resize.timer = setTimeout(onWindowShape, 250);
}
addEventListener('resize', resize);
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function hash(a, b, c) { let h = (a * 374761393 + b * 668265263 + c * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ============================================================
//  SON (WebAudio, généré)
// ============================================================
let actx = null, muted = false, noiseBuf = null;
function AC() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, dur, type, vol, slide, delay) {
  const a = AC(); if (!a || muted) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t0 + dur);
  g.gain.setValueAtTime(vol || 0.08, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, freq, delay) {
  const a = AC(); if (!a || muted) return;
  const t0 = a.currentTime + (delay || 0);
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.2), t0 + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t0, Math.random() * 0.2); s.stop(t0 + dur + 0.02);
}
const SFX = {
  shoot() { noise(0.08, 0.12, 3000); tone(420, 0.08, 'square', 0.035, -250); },
  rocket() { noise(0.22, 0.14, 1800); tone(260, 0.2, 'sawtooth', 0.03, 300); },
  bounce() { tone(1400, 0.035, 'triangle', 0.05, -400); },
  fizzle() { noise(0.08, 0.07, 900); },
  pop() { noise(0.1, 0.1, 2200); tone(900, 0.05, 'square', 0.03, -500); },
  boom() { noise(0.75, 0.45, 900); tone(110, 0.45, 'sine', 0.3, -70); },
  tankBoom() { noise(0.55, 0.35, 1300); tone(160, 0.35, 'triangle', 0.2, -110); },
  mine() { tone(520, 0.07, 'square', 0.05); tone(780, 0.07, 'square', 0.05, 0, 0.08); },
  beep() { tone(1300, 0.05, 'square', 0.022); },
  click() { tone(700, 0.05, 'square', 0.04); },
  join() { tone(660, 0.08, 'square', 0.04); tone(990, 0.1, 'square', 0.04, 0, 0.09); },
  start() { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.045, 0, i * 0.12)); },
  win() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.16, 'square', 0.045, 0, i * 0.11)); tone(1568, 0.5, 'triangle', 0.05, 0, 0.45); },
  lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'square', 0.045, 0, 0.3 + i * 0.18)); },

// ============================================================
//  TYPES DE CHARS  (inspirés de Wii Play Tanks)
// ============================================================
const TYPES = {

  brown:  { name: 'Marron',    color: '#a0703f', dark: '#5c3b1b', speed: 0,   bulletSpeed: 190, bounces: 1, maxBullets: 1, mines: 0, cooldown: 2.4, turret: 1.3, aimErr: 0.28, think: 0.7, wild: 0.25 },
  grey:   { name: 'Gris',      color: '#9a9a94', dark: '#55554f', speed: 62,  turn: 6,  bulletSpeed: 250, bounces: 1, maxBullets: 1, mines: 0, cooldown: 1.9, turret: 1.9, aimErr: 0.12, awareness: 90,  pref: 7 },
  teal:   { name: 'Turquoise', color: '#2fb5a4', dark: '#176b60', speed: 62,  turn: 6,  bulletSpeed: 460, rocket: true, bounces: 0, maxBullets: 1, mines: 0, cooldown: 1.8, turret: 2.2, aimErr: 0.05, awareness: 90, pref: 8, lead: 0.5 },
  yellow: { name: 'Jaune',     color: '#ebc62a', dark: '#8a720c', speed: 122, turn: 8,  bulletSpeed: 250, bounces: 1, maxBullets: 1, mines: 4, mineCd: 4, cooldown: 2, turret: 2.4, aimErr: 0.1, awareness: 120, pref: 6 },
  pink:   { name: 'Rose',      color: '#e2649a', dark: '#8c2f57', speed: 72,  turn: 7,  bulletSpeed: 255, bounces: 1, maxBullets: 3, burst: 3, mines: 0, cooldown: 1.5, turret: 2.8, aimErr: 0.08, awareness: 110, pref: 6 },
  green:  { name: 'Vert',      color: '#46ad46', dark: '#236323', speed: 0,   bulletSpeed: 460, rocket: true, bounces: 2, maxBullets: 2, mines: 0, cooldown: 1.3, turret: 3.2, aimErr: 0.01, precise: true, lead: 0.6 },
  purple: { name: 'Violet',    color: '#9457c4', dark: '#522a70', speed: 125, turn: 8,  bulletSpeed: 275, bounces: 1, maxBullets: 5, mines: 2, mineCd: 6, cooldown: 0.55, turret: 3.4, aimErr: 0.05, awareness: 150, pref: 5, lead: 0.4 },
  white:  { name: 'Blanc',     color: '#f5f5f2', dark: '#9b9b95', speed: 85,  turn: 7,  bulletSpeed: 265, bounces: 1, maxBullets: 5, mines: 2, mineCd: 7, cooldown: 0.75, turret: 3, aimErr: 0.05, awareness: 130, pref: 6, invisible: true, lead: 0.4 },
  black:  { name: 'Noir',      color: '#333336', dark: '#0c0c0e', speed: 165, turn: 10, bulletSpeed: 470, rocket: true, bounces: 0, maxBullets: 2, mines: 2, mineCd: 5, cooldown: 0.7, turret: 4, aimErr: 0.03, awareness: 180, pref: 4, lead: 0.7 },
};
const ORDER = ['brown', 'grey', 'teal', 'yellow', 'pink', 'green', 'purple', 'white', 'black'];
const LETTER = { b: 'brown', g: 'grey', t: 'teal', y: 'yellow', r: 'pink', G: 'green', p: 'purple', w: 'white', k: 'black' };
// couleurs des joueurs (emplacements 0 à 3)
const PCOL = [
  { color: '#2f6fd6', dark: '#173f86', label: 'Bleu' },
  { color: '#d8373f', dark: '#7e151b', label: 'Rouge' },
  { color: '#f08a24', dark: '#8a4608', label: 'Orange' },
  { color: '#36c7e0', dark: '#146f80', label: 'Cyan' },
];
const VS_WIN = 5;

// ============================================================
//  MISSIONS
//  Chaque carte = moitié gauche (11 x 17), complétée en miroir
//  'h' = miroir horizontal, 'r' = rotation 180°.
//  '#' bloc  'x' liège (destructible)  'o' trou  '.' sol
//  u : "lettre colonne ligne" des ennemis

'...........','...........','....ooo....','...........','...........','...........','...........','...........','...........'] },

// ---------- grille ----------
function buildGrid(L) {
  const g = []; for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(0));
  const code = { '.': 0, '#': 1, 'x': 2, 'o': 3 };
  for (let r = 0; r < BASE_R; r++) {
    const row = (L.t[r] || '').padEnd(11, '.').slice(0, 11);
    for (let c = 0; c < 11; c++) {
      const v = code[row[c]] || 0;
      g[OY + r][OX + c] = v;
      if (L.m === 'h') g[OY + r][OX + BASE_C - 1 - c] = v; else g[OY + BASE_R - 1 - r][OX + BASE_C - 1 - c] = v;
    }
  }
  return g;
}
const gridStr = () => grid.map(r => r.join('')).join('');
function parseGrid(s) { const g = []; for (let r = 0; r < ROWS; r++) { g.push([]); for (let c = 0; c < COLS; c++) g[r].push(+s[r * COLS + c] || 0); } return g; }
function tileAt(c, r) { if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return 1; return grid[r][c]; }
function bulletSolid(x, y) { const t = tileAt(Math.floor(x / T), Math.floor(y / T)); return t === 1 || t === 2; }
function bulletBoxSolid(x, y, r) { return bulletSolid(x - r, y - r) || bulletSolid(x + r, y - r) || bulletSolid(x - r, y + r) || bulletSolid(x + r, y + r); }
function snap(c, r) {
  for (let rad = 0; rad < 6; rad++)
    for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
      if (Math.max(Math.abs(dr), Math.abs(dc)) !== rad) continue;
      if (tileAt(c + dc, r + dr) === 0) return { x: (c + dc + 0.5) * T, y: (r + dr + 0.5) * T };
    }
  return { x: (c + 0.5) * T, y: (r + 0.5) * T };
}

let TS = 2; // résolution des calques (réduite pour les très grandes arènes)
const floorCv = document.createElement('canvas');
let trackCv = document.createElement('canvas'), tctx = trackCv.getContext('2d'), arenaReady = false;
// Change la taille de l'arène. La carte de base reste centrée ; les traces au sol sont conservées.
function setArena(cols, rows) {
  if (cols === COLS && rows === ROWS && arenaReady) return;
  arenaReady = true;
  const oldOX = OX, oldOY = OY, oldTrack = trackCv, oldTS = TS;
  COLS = cols; ROWS = rows; AW = COLS * T; AH = ROWS * T; CW = AW; CH = AH + HUD;
  OX = (COLS - BASE_C) / 2; OY = (ROWS - BASE_R) / 2;
  TS = Math.min(2, 2600 / AW);
  buildFloor();
  trackCv = document.createElement('canvas'); trackCv.width = Math.ceil(AW * TS); trackCv.height = Math.ceil(AH * TS);
  tctx = trackCv.getContext('2d');
  if (oldTrack.width) tctx.drawImage(oldTrack, (OX - oldOX) * T * TS, (OY - oldOY) * T * TS, oldTrack.width * TS / oldTS, oldTrack.height * TS / oldTS);
  tctx.setTransform(TS, 0, 0, TS, 0, 0);
  layout();
}
// Agrandit l'arène en pleine partie : la grille et tout ce qui s'y trouve sont décalés d'autant.
function growArena(cols, rows) {
  cols = Math.max(cols, COLS); rows = Math.max(rows, ROWS);
  if (cols === COLS && rows === ROWS) return;
  const old = grid, dx = (cols - COLS) / 2, dy = (rows - ROWS) / 2;
  setArena(cols, rows);
  grid = []; for (let r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(0));
  old.forEach((row, r) => row.forEach((v, c) => { grid[r + dy][c + dx] = v; }));
  const px = dx * T, py = dy * T;
  for (const o of [...tanks, ...bullets, ...mines, ...particles]) { o.x += px; o.y += py; }
  for (const t of tanks) {
    if (!t.ai) continue;
    t.ai.lastX += px; t.ai.lastY += py;
    if (t.ai.path) for (const w of t.ai.path) { w.x += px; w.y += py; }
  }
}
function buildFloor() {
  floorCv.width = Math.ceil(AW * TS); floorCv.height = Math.ceil(AH * TS);
  const f = floorCv.getContext('2d'); f.setTransform(TS, 0, 0, TS, 0, 0);
  // sol clair et épuré : damier très discret, fine grille, grain léger, vignette douce
  const g = f.createLinearGradient(0, 0, AW, AH); g.addColorStop(0, '#f1eee8'); g.addColorStop(1, '#e2ded5');
  f.fillStyle = g; f.fillRect(0, 0, AW, AH);
  f.fillStyle = 'rgba(40,40,70,.022)';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if ((r + c) % 2) f.fillRect(c * T, r * T, T, T);
  f.strokeStyle = 'rgba(40,45,70,.055)'; f.lineWidth = 1;
  f.beginPath();
  for (let c = 1; c < COLS; c++) { f.moveTo(c * T + 0.5, 0); f.lineTo(c * T + 0.5, AH); }
  for (let r = 1; r < ROWS; r++) { f.moveTo(0, r * T + 0.5); f.lineTo(AW, r * T + 0.5); }
  f.stroke();
  for (let i = 0; i < COLS * ROWS * 6; i++) {
    f.fillStyle = `rgba(30,30,50,${rand(0.012, 0.04)})`;
    f.fillRect(rand(0, AW), rand(0, AH), rand(0.6, 1.5), rand(0.6, 1.5));
  }
  const v = f.createRadialGradient(AW / 2, AH / 2, Math.min(AW, AH) * 0.3, AW / 2, AH / 2, Math.max(AW, AH) * 0.72);
  v.addColorStop(0, 'rgba(20,24,45,0)'); v.addColorStop(1, 'rgba(20,24,45,.2)');
  f.fillStyle = v; f.fillRect(0, 0, AW, AH);
}

}

function advance() {
  if (state === 'intro') { state = 'play'; acc = 0; }
  else if (state === 'cleared') {

    missionIdx++; killedSet = new Set();
    if (missionIdx >= LEVELS.length) { state = 'victory'; stateT = 1.5; saveBest(LEVELS.length); fx('sfx', 'win'); }

// ---------- déplacement & collisions ----------
const HB = 14; // demi-taille de la boîte de collision d'un char
function tankSolid(c, r) { return tileAt(c, r) !== 0; }
function moveTank(t, dx, dy) {
  if (dx) {
    t.x += dx;
    const r0 = Math.floor((t.y - HB) / T), r1 = Math.floor((t.y + HB - 0.01) / T);
    const c = dx > 0 ? Math.floor((t.x + HB) / T) : Math.floor((t.x - HB) / T);
    for (let r = r0; r <= r1; r++) if (tankSolid(c, r)) { t.x = dx > 0 ? c * T - HB - 0.001 : (c + 1) * T + HB + 0.001; break; }
  }
  if (dy) {
    t.y += dy;
    const c0 = Math.floor((t.x - HB) / T), c1 = Math.floor((t.x + HB - 0.01) / T);
    const r = dy > 0 ? Math.floor((t.y + HB) / T) : Math.floor((t.y - HB) / T);
    for (let c = c0; c <= c1; c++) if (tankSolid(c, r)) { t.y = dy > 0 ? r * T - HB - 0.001 : (r + 1) * T + HB + 0.001; break; }
  }
}
function driveTank(t, dir, dt) {
  if (!dir) { t.vx = t.vy = 0; return; }
  let target = Math.atan2(dir.y, dir.x);
  const dF = Math.abs(angDiff(target, t.body));
  if (dF > Math.PI / 2 + 0.25) t.rev = true; else if (dF < Math.PI / 2 - 0.25) t.rev = false;
  if (t.rev) target += Math.PI;
  const diff = angDiff(target, t.body), turn = (t.ty.turn || 8) * dt;
  t.body += clamp(diff, -turn, turn);
  const rem = Math.abs(angDiff(target, t.body));
  const f = Math.max(0, Math.cos(Math.min(rem * 2, Math.PI / 2)));
  const sp = t.ty.speed * f * (t.rev ? -1 : 1);
  const ox = t.x, oy = t.y;
  moveTank(t, Math.cos(t.body) * sp * dt, Math.sin(t.body) * sp * dt);
  t.vx = (t.x - ox) / dt; t.vy = (t.y - oy) / dt;
  const moved = Math.hypot(t.x - ox, t.y - oy);
  t.phase += moved * (t.rev ? -1 : 1);
  t.trackAcc += moved + turn * 0.3 * (rem > 0.05 ? 1 : 0);
  if (t.trackAcc > 7) { t.trackAcc = 0; stampTrack(t); }
}
function separate() {
  for (let i = 0; i < tanks.length; i++) {
    const a = tanks[i]; if (!a.alive) continue;
    for (let j = i + 1; j < tanks.length; j++) {
      const b = tanks[j]; if (!b.alive) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = 30;
      if (d < min && d > 0.01) {
        const nx = dx / d, ny = dy / d, push = min - d, ma = a.ty.speed > 0, mb = b.ty.speed > 0;
        if (ma && mb) { moveTank(a, -nx * push / 2, -ny * push / 2); moveTank(b, nx * push / 2, ny * push / 2); }
        else if (ma) moveTank(a, -nx * push, -ny * push);
        else if (mb) moveTank(b, nx * push, ny * push);
      }
    }
  }
}

// ---------- tirs ----------
function fire(t) {
  const a = t.turret, tx = t.x + Math.cos(a) * 26, ty = t.y + Math.sin(a) * 26;
  t.recoil = 1;
  if (bulletBoxSolid(tx, ty, 4) || bulletSolid(t.x + Math.cos(a) * 14, t.y + Math.sin(a) * 14)) {
    fx('puff', tx, ty); fx('sfx', 'fizzle'); return false;
  }
  bullets.push({ x: tx, y: ty, dx: Math.cos(a), dy: Math.sin(a), speed: t.ty.bulletSpeed, bounces: t.ty.bounces, owner: t, r: 4, rocket: !!t.ty.rocket, age: 0, dead: false });
  t.bulletsOut++;
  fx('muzzle', t.x + Math.cos(a) * 27, t.y + Math.sin(a) * 27, a);
  fx('sfx', t.ty.rocket ? 'rocket' : 'shoot');
  return true;
}
function killBullet(b, showFx) {
  if (b.dead) return;
  b.dead = true;
  if (b.owner) b.owner.bulletsOut--;
  if (showFx) fx('puff', b.x, b.y);
}
function stepBullet(b, dt) {
  let remaining = b.speed * dt;
  while (remaining > 0 && !b.dead) {
    const s = Math.min(3, remaining); remaining -= s;
    const nx = b.x + b.dx * s, ny = b.y + b.dy * s;
    if (bulletBoxSolid(nx, ny, b.r)) {
      const hx = bulletBoxSolid(nx, b.y, b.r), hy = bulletBoxSolid(b.x, ny, b.r);
      if (hx) b.dx = -b.dx;
      if (hy) b.dy = -b.dy;
      if (!hx && !hy) { b.dx = -b.dx; b.dy = -b.dy; }
      b.bounces--;
      if (b.bounces < 0) { killBullet(b, true); fx('sfx', 'fizzle'); return; }
      fx('sfx', 'bounce'); fx('sparks', b.x, b.y);
    } else { b.x = nx; b.y = ny; }
  }
}

// ---------- mines ----------
function layMine(t) {
  if (t.minesOut >= t.ty.mines) return false;
  for (const m of mines) if (Math.hypot(m.x - t.x, m.y - t.y) < 36) return false;
  mines.push({ x: t.x, y: t.y, owner: t, t: 0, fuse: 10, dead: false, beep: 0 });
  t.minesOut++; fx('sfx', 'mine');
  return true;
}
function updateMines(dt) {
  for (const m of mines) {
    if (m.dead) continue;
    m.t += dt;
    if (m.t > 0.6) for (const t of tanks) {
      if (!t.alive || t === m.owner) continue;
      if ((t.x - m.x) ** 2 + (t.y - m.y) ** 2 < 40 * 40) m.fuse = Math.min(m.fuse, m.t + 0.12);
    }
    const left = m.fuse - m.t;
    if (left < 2.2) { m.beep -= dt; if (m.beep <= 0) { m.beep = left < 0.8 ? 0.1 : 0.25; fx('sfx', 'beep'); } }
    if (m.t >= m.fuse) { m.dead = true; if (m.owner) m.owner.minesOut--; explode(m.x, m.y, 68, m.owner); }
  }
  mines = mines.filter(m => !m.dead);
}
function explode(x, y, R, by) {
  fx('boom', x, y, true); fx('sfx', 'boom'); fx('scorch', x, y, R * 0.75);

//  RÉSEAU  (P2P WebRTC via PeerJS — l'hôte fait autorité)
// ============================================================
function loadPeer() {
  return new Promise((res, rej) => {
    if (window.Peer) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = () => res();
    s.onerror = () => rej(new Error('Impossible de charger PeerJS. Vérifie ta connexion Internet.'));
    document.head.appendChild(s);
  });
}
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[(Math.random() * A.length) | 0]; return s; }
function cleanupNet() {
  const p = net.peer;
  net.role = 'solo'; net.peer = null; net.hostConn = null; net.code = ''; net.mySlot = 0;
  for (const r of roster) if (r.conn) { try { r.conn.close(); } catch (e) {} }
  if (p) { try { p.destroy(); } catch (e) {} }
  roster = [{ slot: 0, name: myName() }];
  inputs = [];
  ctanks.clear();
}
async function hostGame() {
  cleanupNet();
  roster = [{ slot: 0, name: myName() }]; lobbyMode = 'coop';
  state = 'lobby'; showScreen('scrLobby'); renderLobby();
  setStatus('lobbyStatus', 'Création du salon…');
  try { await loadPeer(); } catch (e) { goTitle(e.message); return; }
  const tryOpen = (attempt) => {
    const code = genCode();
    const peer = new Peer(PREFIX + code, { debug: 0 });
    net.peer = peer;
    peer.on('open', () => {
      if (net.peer !== peer) return;
      net.role = 'host'; net.code = code; net.mySlot = 0;
      renderLobby();
    });
    peer.on('connection', conn => {
      conn.on('data', d => hostOnData(conn, d));
      conn.on('close', () => hostDrop(conn));
      conn.on('error', () => hostDrop(conn));
    });
    peer.on('disconnected', () => { if (net.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} } });
    peer.on('error', err => {
      if (net.peer !== peer) return;
      if (err.type === 'unavailable-id' && attempt < 5) { peer.destroy(); tryOpen(attempt + 1); }
      else if (err.type === 'peer-unavailable') { /* un client a disparu : sans gravité */ }
      else if (state === 'lobby') { cleanupNet(); goTitle('Erreur réseau (' + err.type + '). Réessaie.'); }
    });
  };
  tryOpen(0);
}
function broadcast(msg) { for (const r of roster) if (r.conn && r.conn.open) { try { r.conn.send(msg); } catch (e) {} } }
function broadcastLobby() {
  broadcast({ t: 'lobby', players: roster.map(r => ({ slot: r.slot, name: r.name })), mode: lobbyMode, code: net.code });
  renderLobby();
}
function hostOnData(conn, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello') {
    if (state !== 'lobby') { conn.send({ t: 'refuse', why: 'Une partie est déjà en cours dans ce salon.' }); setTimeout(() => conn.close(), 400); return; }
    const used = new Set(roster.map(r => r.slot));
    let slot = -1; for (let i = 1; i < 4; i++) if (!used.has(i)) { slot = i; break; }
    if (slot < 0) { conn.send({ t: 'refuse', why: 'Le salon est complet (4 joueurs).' }); setTimeout(() => conn.close(), 400); return; }
    conn.slot = slot;
    const name = String(d.name || '').trim().slice(0, 12) || PCOL[slot].label;
    roster.push({ slot, name, conn }); roster.sort((a, b) => a.slot - b.slot);
    inputs[slot] = null;
    conn.send({ t: 'welcome', slot, code: net.code });
    SFX.join();
    broadcastLobby();
  } else if (d.t === 'in' && conn.slot != null) {
    inputs[conn.slot] = { ix: clamp(+d.ix || 0, -1, 1), iy: clamp(+d.iy || 0, -1, 1), mx: +d.mx || 0, my: +d.my || 0, f: +d.f || 0, m: +d.m || 0 };
  }
}
function hostDrop(conn) {
  if (conn.slot == null || !roster.some(r => r.conn === conn)) return;
  roster = roster.filter(r => r.conn !== conn);
  inputs[conn.slot] = null;
  const t = players.find(p => p.slot === conn.slot);
  if (t && t.alive && state !== 'lobby') destroyTank(t, null);
  players = players.filter(p => p.slot !== conn.slot);
  if (state === 'lobby') broadcastLobby();
}

function buildSnap() {
  const s = {
    t: 's', st: state, sT: r2(stateT), mode: game.mode, mi: missionIdx, lv: lives, bn: bonusLife ? 1 : 0, c: COLS, r: ROWS,
    tk: tanks.filter(t => t.alive).map(t => [t.id, t.isPlayer ? t.slot : t.type, r1(t.x), r1(t.y), r2(t.body), r2(t.turret), r2(t.recoil), r2(tankAlpha(t))]),
    b: bullets.filter(b => !b.dead).map(b => [r1(b.x), r1(b.y), r2(b.dx), r2(b.dy), b.speed, b.rocket ? 1 : 0]),

// ---------- côté client ----------
const ctanks = new Map();
async function joinGame(code) {
  cleanupNet();
  setStatus('joinStatus', 'Connexion…');
  $('btnJoinGo').disabled = true;
  const fail = msg => { $('btnJoinGo').disabled = false; cleanupNet(); setStatus('joinStatus', msg); };
  try { await loadPeer(); } catch (e) { fail(e.message); return; }
  const peer = new Peer({ debug: 0 });
  net.peer = peer;
  const timeout = setTimeout(() => { if (net.peer === peer && net.role !== 'client') fail('Pas de réponse du salon. Vérifie le code.'); }, 15000);
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    net.hostConn = conn;
    conn.on('open', () => conn.send({ t: 'hello', name: myName() }));
    conn.on('data', d => { if (d && d.t === 'welcome') { clearTimeout(timeout); $('btnJoinGo').disabled = false; } clientOnData(d); });
    conn.on('close', () => { if (net.hostConn === conn && net.role === 'client') { cleanupNet(); goTitle("La connexion avec l'hôte a été perdue."); } });
  });
  peer.on('error', err => {
    if (net.peer !== peer) return;
    clearTimeout(timeout);
    if (net.role === 'client') { cleanupNet(); goTitle('Erreur réseau (' + err.type + ').'); }
    else fail(err.type === 'peer-unavailable' ? 'Salon introuvable. Vérifie le code.' : 'Erreur réseau (' + err.type + ').');
  });
}
function clientOnData(d) {
  if (!d || typeof d !== 'object') return;
  switch (d.t) {
    case 'welcome':
      net.role = 'client'; net.mySlot = d.slot; net.code = d.code; state = 'lobby';
      SFX.join(); showScreen('scrLobby'); renderLobby();
      break;
    case 'refuse':
      $('btnJoinGo').disabled = false; cleanupNet(); setStatus('joinStatus', d.why);
      break;
    case 'lobby':
      roster = d.players; lobbyMode = d.mode; net.code = d.code || net.code;
      if (state !== 'lobby') { state = 'lobby'; grid = []; tanks = []; players = []; enemies = []; bullets = []; mines = []; ctanks.clear(); }
      showScreen('scrLobby'); renderLobby();
      break;
    case 'start':
      roster = d.players; game.mode = d.mode; ctanks.clear();
      tanks = []; players = []; enemies = []; bullets = []; mines = [];
      net.fireCount = 0; net.mineCount = 0;
      showScreen(null); state = 'intro';
      break;
    case 's':
      applySnap(d);
      break;
  }
}
function newClientTank(id, who, x, y, body, turret) {

  const type = isPlayer ? 'player' : who;
  const ty = TYPES[type] || TYPES.grey;
  return {
    id, isPlayer, slot: isPlayer ? who : -1, type, ty, alive: true,
    color: isPlayer ? PCOL[who].color : ty.color, dark: isPlayer ? PCOL[who].dark : ty.dark,
    x, y, body, turret, nx: x, ny: y, nb: body, nt: turret, recoil: 0, alpha: 1, phase: 0, trackAcc: 0,

}
function applySnap(s) {

  kills = s.k || {}; totalKills = s.tkc || 0; pstats = s.pk || {}; scores = s.sc || scores; round = s.rd; roundWinner = s.rw;
  if (s.c && (s.c !== COLS || s.r !== ROWS)) {
    // l'hôte a changé la taille de l'arène : on décale ce qui est déjà affiché
    const dx = (s.c - COLS) / 2 * T, dy = (s.r - ROWS) / 2 * T;
    setArena(s.c, s.r);
    for (const t of tanks) { t.x += dx; t.y += dy; }
    for (const p of particles) { p.x += dx; p.y += dy; }
  }
  if (s.g) grid = parseGrid(s.g);
  const seen = new Set();
  for (const a of s.tk) {
    const [id, who, x, y, bd, tu, rc, al] = a;
    let t = ctanks.get(id);
    if (!t) { t = newClientTank(id, who, x, y, bd, tu); ctanks.set(id, t); }
    t.nx = x; t.ny = y; t.nb = bd; t.nt = tu; t.alpha = al;
    if (rc > t.recoil) t.recoil = rc;
    seen.add(id);
  }
  for (const id of [...ctanks.keys()]) if (!seen.has(id)) ctanks.delete(id);
  tanks = [...ctanks.values()];
  players = tanks.filter(t => t.isPlayer); enemies = tanks.filter(t => !t.isPlayer);
  bullets = s.b.map(a => ({ x: a[0], y: a[1], dx: a[2], dy: a[3], speed: a[4], rocket: !!a[5], r: 4 }));
  mines = s.m.map(a => ({ x: a[0], y: a[1], t: 0, fuse: a[2] }));
  for (const e of s.ev) { const f = FX[e[0]]; if (f) f(...e.slice(1)); }
}
function clientFrame(dt) {
  if (stateT > -5) stateT -= dt;
  const k = 1 - Math.exp(-dt * 18);
  for (const t of tanks) {
    const ox = t.x, oy = t.y;
    if (Math.hypot(t.nx - t.x, t.ny - t.y) > 80) { t.x = t.nx; t.y = t.ny; }
    else { t.x += (t.nx - t.x) * k; t.y += (t.ny - t.y) * k; }
    t.body += angDiff(t.nb, t.body) * k;
    t.turret += angDiff(t.nt, t.turret) * k;
    if (t.isPlayer && t.slot === net.mySlot && state === 'play') t.turret = Math.atan2(mouse.y - t.y, mouse.x - t.x);
    const mv = Math.hypot(t.x - ox, t.y - oy);
    if (mv > 0.05 && mv < 40) {
      t.phase += (t.x - ox) * Math.cos(t.body) + (t.y - oy) * Math.sin(t.body);
      t.trackAcc += mv;
      if (t.trackAcc > 7) { t.trackAcc = 0; stampTrack(t); }
    }
    t.recoil = Math.max(0, t.recoil - dt * 6);
  }
  for (const m of mines) m.fuse -= dt;
  // les obus continuent leur trajectoire entre deux mises à jour de l'hôte
  for (const b of bullets) {
    let rem = b.speed * dt;
    while (rem > 0) {
      const s = Math.min(3, rem); rem -= s;
      const nx = b.x + b.dx * s, ny = b.y + b.dy * s;
      if (bulletBoxSolid(nx, ny, 4)) {
        const hx = bulletBoxSolid(nx, b.y, 4), hy = bulletBoxSolid(b.x, ny, 4);
        if (hx) b.dx = -b.dx; if (hy) b.dy = -b.dy; if (!hx && !hy) { b.dx = -b.dx; b.dy = -b.dy; }
      } else { b.x = nx; b.y = ny; }
    }
  }
  // envoi des commandes à l'hôte (~30 fois/s, immédiatement pour un tir ou une mine)
  net.inAcc += dt;
  const inp = localInput(), key = JSON.stringify(inp);
  const urgent = inp.f !== net.lastF || inp.m !== net.lastM;
  if (net.hostConn && net.hostConn.open && key !== net.lastSentIn && (urgent || net.inAcc >= 1 / 30)) {
    try { net.hostConn.send({ t: 'in', ...inp }); } catch (e) {}
    net.lastSentIn = key; net.inAcc = 0; net.lastF = inp.f; net.lastM = inp.m;
  }
}

// ============================================================
//  ENTRÉES
// ============================================================
const keys = {};
const mouse = { x: AW / 2, y: AH / 2, sx: innerWidth / 2, sy: innerHeight / 2 };
function localInput() {
  let ix = 0, iy = 0;
  if (!uiVisible()) {
    if (keys.KeyW || keys.ArrowUp) iy--; if (keys.KeyS || keys.ArrowDown) iy++;
    if (keys.KeyA || keys.ArrowLeft) ix--; if (keys.KeyD || keys.ArrowRight) ix++;
  }
  return { ix, iy, mx: Math.round(mouse.x), my: Math.round(mouse.y), f: net.fireCount, m: net.mineCount };
}
const canAct = () => state === 'play' && !paused && !!myTank();
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  AC();
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyF') toggleFullscreen();
  if ((e.code === 'KeyP' || e.code === 'Escape') && net.role === 'solo' && ['play', 'cleared', 'dead'].includes(state)) paused = !paused;
  if (e.code === 'Space' && canAct()) net.mineCount++;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play' && net.role === 'solo') paused = true; });
function mouseToWorld() { mouse.x = (mouse.sx * view.dpr - view.x) / view.s; mouse.y = (mouse.sy * view.dpr - view.y) / view.s; }
function setMouse(e) { mouse.sx = e.clientX; mouse.sy = e.clientY; mouseToWorld(); }
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } catch (e) {}
}
$('btnFull').onclick = toggleFullscreen;
addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => {
  setMouse(e); AC();
  if (e.button === 0) {
    if (['gameover', 'victory', 'vsEnd'].includes(state) && stateT <= 0) {
      if (net.role === 'host') backToLobby();
      else if (net.role === 'solo') goTitle();
    } else if (canAct()) net.fireCount++;
  } else if (e.button === 2 && canAct()) net.mineCount++;
});
cv.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
//  BOUCLE PRINCIPALE
// ============================================================
const STEP = 1 / 120;
let acc = 0, lastT = performance.now(), lastFrameAt = 0;
const SIM_STATES = ['play', 'cleared', 'dead', 'roundEnd'];
const TIMED_STATES = ['intro', 'cleared', 'dead', 'roundEnd'];
function runFrame(now) {
  lastFrameAt = performance.now();
  // jusqu'à 0,25 s de rattrapage : l'hôte reste à l'heure même si son onglet ralentit
  const dt = Math.min(0.25, Math.max(0, (now - lastT) / 1000)); lastT = now;
  time += dt;
  layout(); mouseToWorld();
  if (net.role === 'client') {
    if (state !== 'lobby' && state !== 'title') clientFrame(dt);
  } else if (state !== 'title' && state !== 'lobby') {
    inputs[net.mySlot] = localInput();
    if (!paused) {
      if (SIM_STATES.includes(state)) { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } }
      if (state !== 'play') { stateT -= dt; if (stateT <= 0 && TIMED_STATES.includes(state)) advance(); }
    }
    if (net.role === 'host') {
      net.sendAcc += dt;
      if (net.sendAcc >= 1 / 30) { net.sendAcc = 0; if (state !== 'lobby') broadcast(buildSnap()); }
    }
  }
  if (!paused) visuals(dt);
  render();
}
function loop(now) { runFrame(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
// Horloge de secours : si l'onglet de l'hôte passe en arrière-plan, la partie continue pour les autres.
(function backupClock() {
  const tick = () => { if (performance.now() - lastFrameAt > 120) runFrame(performance.now()); };
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),16)'], { type: 'text/javascript' })));
    w.onmessage = tick;
  } catch (e) { setInterval(tick, 16); }
})();

resize();
goTitle();

// petit accès de débogage : tanksDebug.go(12) lance la mission 12 en solo
window.tanksDebug = {
  go(n) { cleanupNet(); roster = [{ slot: 0, name: myName() }]; game.mode = 'coop'; showScreen(null); startGame(); missionIdx = clamp(n - 1, 0, LEVELS.length - 1); killedSet = new Set(); startMission(); },
  get state() { return state; }, net,
};
</script>
