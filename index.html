<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanks!</title>
<style>
  html,body{margin:0;height:100%;background:#1b1611;overflow:hidden}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative}
  canvas{display:block;border-radius:8px;box-shadow:0 12px 50px rgba(0,0,0,.65);cursor:none}
  #ui{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden}
  #uiInner{position:absolute;left:0;top:0;width:880px;height:732px;transform-origin:0 0;font-family:"Trebuchet MS",Verdana,sans-serif;color:#f6ead2}
  .screen{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;padding-top:150px;box-sizing:border-box}
  .screen.on{display:flex}
  .panel{pointer-events:auto;cursor:default;background:rgba(58,30,10,.92);border:2px solid #c99a5b;border-radius:16px;padding:20px 28px;width:380px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:11px;text-align:center}
  .panel.wide{width:460px}
  .panel h2{margin:0;color:#ffd35a;font-size:26px}
  button{font:bold 18px "Trebuchet MS",Verdana,sans-serif;color:#fff;background:linear-gradient(#d8323b,#9a1520);border:2px solid #f5d77a;border-radius:10px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 #5a0c12;transition:transform .08s,filter .1s}
  button:hover{filter:brightness(1.12)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #5a0c12}
  button:disabled{filter:grayscale(.7) brightness(.75);cursor:not-allowed}
  button.sec{background:linear-gradient(#7a5634,#4a3220);border-color:#c99a5b;box-shadow:0 3px 0 #24170c;font-size:16px}
  button.small{padding:4px 12px;font-size:14px}
  input{font:bold 20px "Trebuchet MS",Verdana,sans-serif;padding:8px 12px;border-radius:8px;border:2px solid #c99a5b;background:#fff7e6;color:#3a2210;text-align:center;outline:none}
  input:focus{border-color:#ffd35a;box-shadow:0 0 0 3px rgba(255,211,90,.35)}
  #code{letter-spacing:8px;text-transform:uppercase;font-size:28px}
  .status{min-height:20px;margin:0;color:#ffcf8a;font-size:15px}
  #scrLobby{padding-top:175px}
  #scrLobby .panel{gap:9px;padding:16px 26px}
  .code-box{font-size:14px;color:#c9a77a}
  .code-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:2px}
  .code-row b{font-size:32px;letter-spacing:7px;color:#ffd35a}
  ul.players{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  ul.players li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:8px;padding:6px 10px;font-size:15px;text-align:left;min-width:0}
  ul.players li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.players li.empty{color:#8d7458;font-style:italic}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.45);flex:none}
  .tag{margin-left:auto;font-size:12px;color:#c9a77a}
  .modes{display:flex;gap:10px}
  .modes button{flex:1}
  .modes button.sel{background:linear-gradient(#ffcf3a,#e08a12);color:#3a1a00;border-color:#fff3c0}
  .modes button:disabled.sel{filter:none;cursor:default}
  .hint{font-size:13px;color:#c9a77a;margin:0;line-height:1.45}
  .label{font-size:13px;color:#c9a77a;text-align:left;margin-bottom:-6px}
</style>

<script>
'use strict';
// ============================================================
//  TANKS!  —  recréation du mini-jeu de Wii Play, avec multijoueur en ligne
// ============================================================
const COLS = 22, ROWS = 17, T = 40, AW = COLS * T, AH = ROWS * T, HUD = 52, CW = AW, CH = AH + HUD;
const TAU = Math.PI * 2;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), uiBox = document.getElementById('ui'), uiInner = document.getElementById('uiInner');
let scale = 1;
function resize() {
  const s = Math.min(innerWidth / CW, innerHeight / CH) * 0.97;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(CW * s), h = Math.floor(CH * s);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  uiBox.style.width = w + 'px'; uiBox.style.height = h + 'px';
  uiInner.style.transform = `scale(${w / CW})`;
  cv.width = Math.floor(CW * s * dpr); cv.height = Math.floor(CH * s * dpr);
  scale = cv.width / CW;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function hash(a, b, c) { let h = (a * 374761393 + b * 668265263 + c * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ============================================================
//  SON (WebAudio, généré)
// ============================================================
let actx = null, muted = false, noiseBuf = null;
function AC() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, dur, type, vol, slide, delay) {
  const a = AC(); if (!a || muted) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t0 + dur);
  g.gain.setValueAtTime(vol || 0.08, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, freq, delay) {
  const a = AC(); if (!a || muted) return;
  const t0 = a.currentTime + (delay || 0);
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.2), t0 + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t0, Math.random() * 0.2); s.stop(t0 + dur + 0.02);
}
const SFX = {

// ---------- grille ----------
function buildGrid(L) {
  const g = []; for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(0));
  const code = { '.': 0, '#': 1, 'x': 2, 'o': 3 };
  for (let r = 0; r < ROWS; r++) {
    const row = (L.t[r] || '').padEnd(11, '.').slice(0, 11);
    for (let c = 0; c < 11; c++) {

function update(dt) {

    if (state === 'play' && inp) {
      const l = Math.hypot(inp.ix, inp.iy);
      driveTank(p, l ? { x: inp.ix / l, y: inp.iy / l } : null, dt);
      p.turret = Math.atan2(inp.my - p.y, inp.mx - p.x);

    aiMine(e, dt);

    }
  }
  for (const b of bullets) {
    if (b.dead) continue;
    for (const t of tanks) {
      if (!t.alive || (t === b.owner && b.age < 0.08)) continue;
      const dx = t.x - b.x, dy = t.y - b.y;

  }

  bullets = bullets.filter(b => !b.dead);

  if (state === 'play') {
    const alive = players.filter(p => p.alive);
    if (game.mode === 'versus') {
      if (alive.length <= 1 && (players.length > 1 || alive.length === 0)) {

        if (roundWinner >= 0) scores[roundWinner]++;

        fx('sfx', 'win');
      }
    } else if (enemies.every(e => !e.alive)) {
      state = 'cleared'; stateT = 3.2;
      bonusLife = (missionIdx + 1) % 5 === 0 && missionIdx + 1 < LEVELS.length;
      fx('sfx', 'win');

  }
}

// ============================================================
//  RÉSEAU  (P2P WebRTC via PeerJS — l'hôte fait autorité)
// ============================================================
function loadPeer() {
  return new Promise((res, rej) => {
    if (window.Peer) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = () => res();
    s.onerror = () => rej(new Error('Impossible de charger PeerJS. Vérifie ta connexion Internet.'));
    document.head.appendChild(s);
  });
}
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[(Math.random() * A.length) | 0]; return s; }
function cleanupNet() {
  const p = net.peer;
  net.role = 'solo'; net.peer = null; net.hostConn = null; net.code = ''; net.mySlot = 0;
  for (const r of roster) if (r.conn) { try { r.conn.close(); } catch (e) {} }
  if (p) { try { p.destroy(); } catch (e) {} }
  roster = [{ slot: 0, name: myName() }];
  inputs = [];
  ctanks.clear();
}
async function hostGame() {
  cleanupNet();
  roster = [{ slot: 0, name: myName() }]; lobbyMode = 'coop';
  state = 'lobby'; showScreen('scrLobby'); renderLobby();
  setStatus('lobbyStatus', 'Création du salon…');
  try { await loadPeer(); } catch (e) { goTitle(e.message); return; }
  const tryOpen = (attempt) => {
    const code = genCode();
    const peer = new Peer(PREFIX + code, { debug: 0 });
    net.peer = peer;
    peer.on('open', () => {
      if (net.peer !== peer) return;
      net.role = 'host'; net.code = code; net.mySlot = 0;
      renderLobby();
    });
    peer.on('connection', conn => {
      conn.on('data', d => hostOnData(conn, d));
      conn.on('close', () => hostDrop(conn));
      conn.on('error', () => hostDrop(conn));
    });
    peer.on('disconnected', () => { if (net.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} } });
    peer.on('error', err => {
      if (net.peer !== peer) return;
      if (err.type === 'unavailable-id' && attempt < 5) { peer.destroy(); tryOpen(attempt + 1); }
      else if (err.type === 'peer-unavailable') { /* un client a disparu : sans gravité */ }
      else if (state === 'lobby') { cleanupNet(); goTitle('Erreur réseau (' + err.type + '). Réessaie.'); }
    });
  };
  tryOpen(0);
}
function broadcast(msg) { for (const r of roster) if (r.conn && r.conn.open) { try { r.conn.send(msg); } catch (e) {} } }
function broadcastLobby() {
  broadcast({ t: 'lobby', players: roster.map(r => ({ slot: r.slot, name: r.name })), mode: lobbyMode, code: net.code });
  renderLobby();
}
function hostOnData(conn, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello') {
    if (state !== 'lobby') { conn.send({ t: 'refuse', why: 'Une partie est déjà en cours dans ce salon.' }); setTimeout(() => conn.close(), 400); return; }
    const used = new Set(roster.map(r => r.slot));
    let slot = -1; for (let i = 1; i < 4; i++) if (!used.has(i)) { slot = i; break; }
    if (slot < 0) { conn.send({ t: 'refuse', why: 'Le salon est complet (4 joueurs).' }); setTimeout(() => conn.close(), 400); return; }
    conn.slot = slot;
    const name = String(d.name || '').trim().slice(0, 12) || PCOL[slot].label;
    roster.push({ slot, name, conn }); roster.sort((a, b) => a.slot - b.slot);
    inputs[slot] = null;
    conn.send({ t: 'welcome', slot, code: net.code });
    SFX.join();
    broadcastLobby();
  } else if (d.t === 'in' && conn.slot != null) {
    inputs[conn.slot] = { ix: clamp(+d.ix || 0, -1, 1), iy: clamp(+d.iy || 0, -1, 1), mx: +d.mx || 0, my: +d.my || 0, f: +d.f || 0, m: +d.m || 0 };
  }
}
function hostDrop(conn) {
  if (conn.slot == null || !roster.some(r => r.conn === conn)) return;
  roster = roster.filter(r => r.conn !== conn);
  inputs[conn.slot] = null;
  const t = players.find(p => p.slot === conn.slot);
  if (t && t.alive && state !== 'lobby') destroyTank(t, null);
  players = players.filter(p => p.slot !== conn.slot);
  if (state === 'lobby') broadcastLobby();
}
function startOnline() {
  game.mode = lobbyMode;
  outbox = [];
  broadcast({ t: 'start', mode: game.mode, players: roster.map(r => ({ slot: r.slot, name: r.name })) });
  showScreen(null);
  startGame();
}
function backToLobby() {
  state = 'lobby'; grid = []; tanks = []; players = []; enemies = []; bullets = []; mines = []; outbox = [];
  showScreen('scrLobby');
  broadcastLobby();
}
function buildSnap() {
  const s = {
    t: 's', st: state, sT: r2(stateT), mode: game.mode, mi: missionIdx, lv: lives, bn: bonusLife ? 1 : 0,
    tk: tanks.filter(t => t.alive).map(t => [t.id, t.isPlayer ? t.slot : t.type, r1(t.x), r1(t.y), r2(t.body), r2(t.turret), r2(t.recoil), r2(tankAlpha(t))]),
    b: bullets.filter(b => !b.dead).map(b => [r1(b.x), r1(b.y), r2(b.dx), r2(b.dy), b.speed, b.rocket ? 1 : 0]),
    m: mines.map(m => [r1(m.x), r1(m.y), r2(m.fuse - m.t)]),
    ev: outbox, k: kills, tkc: totalKills, pk: pstats, sc: scores, rd: round, rw: roundWinner,
  };
  const g = gridStr();
  if (g !== net.lastGridSent) { s.g = g; net.lastGridSent = g; }
  outbox = [];
  return s;
}

// ---------- côté client ----------
const ctanks = new Map();
async function joinGame(code) {
  cleanupNet();
  setStatus('joinStatus', 'Connexion…');
  $('btnJoinGo').disabled = true;
  const fail = msg => { $('btnJoinGo').disabled = false; cleanupNet(); setStatus('joinStatus', msg); };
  try { await loadPeer(); } catch (e) { fail(e.message); return; }
  const peer = new Peer({ debug: 0 });
  net.peer = peer;
  const timeout = setTimeout(() => { if (net.peer === peer && net.role !== 'client') fail('Pas de réponse du salon. Vérifie le code.'); }, 15000);
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    net.hostConn = conn;
    conn.on('open', () => conn.send({ t: 'hello', name: myName() }));
    conn.on('data', d => { if (d && d.t === 'welcome') { clearTimeout(timeout); $('btnJoinGo').disabled = false; } clientOnData(d); });
    conn.on('close', () => { if (net.hostConn === conn && net.role === 'client') { cleanupNet(); goTitle("La connexion avec l'hôte a été perdue."); } });
  });
  peer.on('error', err => {
    if (net.peer !== peer) return;
    clearTimeout(timeout);
    if (net.role === 'client') { cleanupNet(); goTitle('Erreur réseau (' + err.type + ').'); }
    else fail(err.type === 'peer-unavailable' ? 'Salon introuvable. Vérifie le code.' : 'Erreur réseau (' + err.type + ').');
  });
}
function clientOnData(d) {
  if (!d || typeof d !== 'object') return;
  switch (d.t) {
    case 'welcome':
      net.role = 'client'; net.mySlot = d.slot; net.code = d.code; state = 'lobby';
      SFX.join(); showScreen('scrLobby'); renderLobby();
      break;
    case 'refuse':
      $('btnJoinGo').disabled = false; cleanupNet(); setStatus('joinStatus', d.why);
      break;
    case 'lobby':
      roster = d.players; lobbyMode = d.mode; net.code = d.code || net.code;
      if (state !== 'lobby') { state = 'lobby'; grid = []; tanks = []; players = []; enemies = []; bullets = []; mines = []; ctanks.clear(); }
      showScreen('scrLobby'); renderLobby();
      break;
    case 'start':
      roster = d.players; game.mode = d.mode; ctanks.clear();
      tanks = []; players = []; enemies = []; bullets = []; mines = [];
      net.fireCount = 0; net.mineCount = 0;
      showScreen(null); state = 'intro';
      break;
    case 's':
      applySnap(d);
      break;
  }
}
function newClientTank(id, who, x, y, body, turret) {
  const isPlayer = typeof who === 'number';
  const type = isPlayer ? 'player' : who;
  const ty = TYPES[type] || TYPES.grey;
  return {
    id, isPlayer, slot: isPlayer ? who : -1, type, ty, alive: true,
    color: isPlayer ? PCOL[who].color : ty.color, dark: isPlayer ? PCOL[who].dark : ty.dark,
    x, y, body, turret, nx: x, ny: y, nb: body, nt: turret, recoil: 0, alpha: 1, phase: 0, trackAcc: 0,
  };
}
function applySnap(s) {
  state = s.st; stateT = s.sT; game.mode = s.mode; missionIdx = s.mi; lives = s.lv; bonusLife = !!s.bn;
  kills = s.k || {}; totalKills = s.tkc || 0; pstats = s.pk || {}; scores = s.sc || scores; round = s.rd; roundWinner = s.rw;
  if (s.g) grid = parseGrid(s.g);
  const seen = new Set();
  for (const a of s.tk) {
    const [id, who, x, y, bd, tu, rc, al] = a;
    let t = ctanks.get(id);
    if (!t) { t = newClientTank(id, who, x, y, bd, tu); ctanks.set(id, t); }
    t.nx = x; t.ny = y; t.nb = bd; t.nt = tu; t.alpha = al;
    if (rc > t.recoil) t.recoil = rc;
    seen.add(id);
  }
  for (const id of [...ctanks.keys()]) if (!seen.has(id)) ctanks.delete(id);
  tanks = [...ctanks.values()];
  players = tanks.filter(t => t.isPlayer); enemies = tanks.filter(t => !t.isPlayer);
  bullets = s.b.map(a => ({ x: a[0], y: a[1], dx: a[2], dy: a[3], speed: a[4], rocket: !!a[5], r: 4 }));
  mines = s.m.map(a => ({ x: a[0], y: a[1], t: 0, fuse: a[2] }));
  for (const e of s.ev) { const f = FX[e[0]]; if (f) f(...e.slice(1)); }
}
function clientFrame(dt) {
  if (stateT > -5) stateT -= dt;
  const k = 1 - Math.exp(-dt * 18);
  for (const t of tanks) {
    const ox = t.x, oy = t.y;
    if (Math.hypot(t.nx - t.x, t.ny - t.y) > 80) { t.x = t.nx; t.y = t.ny; }
    else { t.x += (t.nx - t.x) * k; t.y += (t.ny - t.y) * k; }
    t.body += angDiff(t.nb, t.body) * k;
    t.turret += angDiff(t.nt, t.turret) * k;
    if (t.isPlayer && t.slot === net.mySlot && state === 'play') t.turret = Math.atan2(mouse.y - t.y, mouse.x - t.x);
    const mv = Math.hypot(t.x - ox, t.y - oy);
    if (mv > 0.05 && mv < 40) {
      t.phase += (t.x - ox) * Math.cos(t.body) + (t.y - oy) * Math.sin(t.body);
      t.trackAcc += mv;
      if (t.trackAcc > 7) { t.trackAcc = 0; stampTrack(t); }
    }
    t.recoil = Math.max(0, t.recoil - dt * 6);
  }
  for (const m of mines) m.fuse -= dt;
  // les obus continuent leur trajectoire entre deux mises à jour de l'hôte
  for (const b of bullets) {
    let rem = b.speed * dt;
    while (rem > 0) {
      const s = Math.min(3, rem); rem -= s;
      const nx = b.x + b.dx * s, ny = b.y + b.dy * s;
      if (bulletBoxSolid(nx, ny, 4)) {
        const hx = bulletBoxSolid(nx, b.y, 4), hy = bulletBoxSolid(b.x, ny, 4);
        if (hx) b.dx = -b.dx; if (hy) b.dy = -b.dy; if (!hx && !hy) { b.dx = -b.dx; b.dy = -b.dy; }
      } else { b.x = nx; b.y = ny; }
    }
  }
  // envoi des commandes à l'hôte (~30 fois/s, immédiatement pour un tir ou une mine)
  net.inAcc += dt;
  const inp = localInput(), key = JSON.stringify(inp);
  const urgent = inp.f !== net.lastF || inp.m !== net.lastM;
  if (net.hostConn && net.hostConn.open && key !== net.lastSentIn && (urgent || net.inAcc >= 1 / 30)) {
    try { net.hostConn.send({ t: 'in', ...inp }); } catch (e) {}
    net.lastSentIn = key; net.inAcc = 0; net.lastF = inp.f; net.lastM = inp.m;
  }
}

// ============================================================
//  ENTRÉES
// ============================================================
const keys = {};
const mouse = { x: AW / 2, y: AH / 2 };
function localInput() {
  let ix = 0, iy = 0;
  if (!uiVisible()) {
    if (keys.KeyW || keys.ArrowUp) iy--; if (keys.KeyS || keys.ArrowDown) iy++;
    if (keys.KeyA || keys.ArrowLeft) ix--; if (keys.KeyD || keys.ArrowRight) ix++;
  }
  return { ix, iy, mx: Math.round(mouse.x), my: Math.round(mouse.y), f: net.fireCount, m: net.mineCount };
}
const canAct = () => state === 'play' && !paused && !!myTank();
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  AC();
  if (e.code === 'KeyM') muted = !muted;
  if ((e.code === 'KeyP' || e.code === 'Escape') && net.role === 'solo' && ['play', 'cleared', 'dead'].includes(state)) paused = !paused;
  if (e.code === 'Space' && canAct()) net.mineCount++;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play' && net.role === 'solo') paused = true; });
function setMouse(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * CW; mouse.y = (e.clientY - r.top) / r.height * CH; }
addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => {
  setMouse(e); AC();
  if (e.button === 0) {
    if (['gameover', 'victory', 'vsEnd'].includes(state) && stateT <= 0) {
      if (net.role === 'host') backToLobby();
      else if (net.role === 'solo') goTitle();
    } else if (canAct()) net.fireCount++;
  } else if (e.button === 2 && canAct()) net.mineCount++;
});
cv.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
//  BOUCLE PRINCIPALE
// ============================================================
const STEP = 1 / 120;
let acc = 0, lastT = performance.now(), lastFrameAt = 0;
const SIM_STATES = ['play', 'cleared', 'dead', 'roundEnd'];
const TIMED_STATES = ['intro', 'cleared', 'dead', 'roundEnd'];
function runFrame(now) {
  lastFrameAt = performance.now();
  // jusqu'à 0,25 s de rattrapage : l'hôte reste à l'heure même si son onglet ralentit
  const dt = Math.min(0.25, Math.max(0, (now - lastT) / 1000)); lastT = now;
  time += dt;
  if (net.role === 'client') {
    if (state !== 'lobby' && state !== 'title') clientFrame(dt);
  } else if (state !== 'title' && state !== 'lobby') {
    inputs[net.mySlot] = localInput();
    if (!paused) {
      if (SIM_STATES.includes(state)) { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } }
      if (state !== 'play') { stateT -= dt; if (stateT <= 0 && TIMED_STATES.includes(state)) advance(); }
    }
    if (net.role === 'host') {
      net.sendAcc += dt;
      if (net.sendAcc >= 1 / 30) { net.sendAcc = 0; if (state !== 'lobby') broadcast(buildSnap()); }
    }
  }
  if (!paused) visuals(dt);
  render();
}
function loop(now) { runFrame(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
// Horloge de secours : si l'onglet de l'hôte passe en arrière-plan, la partie continue pour les autres.
(function backupClock() {
  const tick = () => { if (performance.now() - lastFrameAt > 120) runFrame(performance.now()); };
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),16)'], { type: 'text/javascript' })));
    w.onmessage = tick;
  } catch (e) { setInterval(tick, 16); }
})();

goTitle();

// petit accès de débogage : tanksDebug.go(12) lance la mission 12 en solo
window.tanksDebug = {
  go(n) { cleanupNet(); roster = [{ slot: 0, name: myName() }]; game.mode = 'coop'; showScreen(null); startGame(); missionIdx = clamp(n - 1, 0, LEVELS.length - 1); killedSet = new Set(); startMission(); },
  get state() { return state; }, net,
};
</script>
